<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/nocturne-167c3630-4a16-4056-855f-ba15d3f3fc74/styles.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<script src="_ds/nocturne-167c3630-4a16-4056-855f-ba15d3f3fc74/_ds_bundle.js"></script>
<link rel="stylesheet" href="theme-rose.css">
<link rel="stylesheet" href="theme-amber.css">
</helmet>
<div style="min-width:0;border-radius:8px;overflow:hidden;background:var(--pa-bg-2);box-shadow:0 0 0 1px rgba(236,238,244,0.09)">
  <div style="position:relative;flex:none;aspect-ratio:{{ ratio }};overflow:hidden;background:var(--pa-bg-1)">
    <div style="position:absolute;inset:-14%;background:{{ art }};filter:{{ blurCss }}"></div>
    <div style="position:absolute;inset:0;background:linear-gradient(to top, color-mix(in srgb, var(--pa-bg-00) 90%, transparent), color-mix(in srgb, var(--pa-bg-00) 5%, transparent) 62%)"></div>
    <sc-if value="{{ isBlurred }}" hint-placeholder-val="{{ true }}">
      <div style="position:absolute;inset:0;display:grid;place-items:center;color:rgba(236,238,244,0.5);font-size:20px"><i class="ph ph-eye-closed"></i></div>
    </sc-if>
    <div style="position:absolute;left:7px;top:7px;display:flex;gap:5px">
      <span style="font-size:10px;padding:2px 6px;border-radius:5px;background:color-mix(in srgb, var(--pa-bg-00) 76%, transparent);color:var(--pa-text-dim)">{{ res }}</span>
    </div>
    <div style="position:absolute;right:7px;bottom:7px;font-size:10px;padding:2px 6px;border-radius:5px;background:color-mix(in srgb, var(--pa-bg-00) 82%, transparent);color:var(--pa-text);font-variant-numeric:tabular-nums">{{ dur }}</div>
    <div style="position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(236,238,244,0.12)"><div style="height:100%;width:{{ progress }};background:var(--pa-accent-500)"></div></div>
  </div>
  <div style="padding:8.4px 9px 10px;display:flex;flex-direction:column;gap:5px">
    <div style="font-size:13px;line-height:1.25;color:var(--pa-text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ title }}</div>
    <div style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--pa-text-muted);min-width:0">
      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0">{{ meta }}</span>
      <span style="margin-left:auto;display:flex;align-items:center;gap:3px;flex:none;color:var(--pa-accent-300)"><i class="ph ph-tag" style="font-size:11px"></i>{{ tagCount }}</span>
    </div>
    <div style="display:flex;align-items:center;gap:4px;min-width:0">
      <span style="display:flex;gap:1px">
        <sc-for list="{{ stars }}" as="s" hint-placeholder-count="5">
          <i class="{{ s.icon }}" style="font-size:10px;color:{{ s.color }}"></i>
        </sc-for>
      </span>
      <span style="font-size:10px;color:var(--pa-text-dim);font-variant-numeric:tabular-nums">{{ score }}</span>
      <span style="margin-left:auto;flex:none;display:flex;align-items:center;gap:3px;font-size:10px;color:var(--pa-text-faint)"><i class="ph ph-chat-circle" style="font-size:10px"></i>{{ comments }}</span>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:240,&quot;height&quot;:200},&quot;item&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{title:string,meta:string,dur:string,res:string,tags:number,hue:number,progress:string}&quot;},&quot;blur&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const it = this.props.item || {};
    const h = it.hue == null ? 280 : it.hue;
    const blurred = this.props.blur !== false;
    const rating = it.rating == null ? 0 : it.rating;
    const hue = (extra) => 'calc(var(--pa-art-hue, 268deg) + ' +
      (Math.round((((h - 268 + 540) % 360) - 180) * 0.28) + extra) + 'deg)';
    const stars = [1, 2, 3, 4, 5].map(n => rating >= n - 0.5
      ? { icon: 'ph-fill ph-star', color: 'var(--pa-accent-500)' }
      : { icon: 'ph ph-star', color: 'var(--pa-bg-4)' });
    return {
      ratio: this.props.ratio || '16/10',
      stars,
      score: rating ? rating.toFixed(1) : '—',
      comments: it.comments == null ? 0 : it.comments,
      title: it.title || 'Untitled clip',
      meta: it.meta || 'Unsorted',
      dur: it.dur || '18:42',
      res: it.res || '1080p',
      tagCount: it.tags == null ? 0 : it.tags,
      progress: it.progress || '0%',
      isBlurred: blurred,
      blurCss: blurred
        ? 'blur(var(--pa-art-blur-md, 17px)) saturate(calc(1.25 * var(--pa-art-sat, 1)))'
        : 'blur(2px) saturate(calc(1.1 * var(--pa-art-sat, 1)))',
      art: 'radial-gradient(58% 66% at 32% 34%, hsl(' + hue(0) + ' 34% 54%), transparent 72%),' +
           'radial-gradient(52% 62% at 74% 64%, hsl(' + hue(26) + ' 32% 44%), transparent 74%),' +
           'linear-gradient(155deg,var(--pa-bg-3),var(--pa-bg-1))'
    };
  }
}

</script>
</body>
</html>
