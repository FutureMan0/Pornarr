<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/nocturne-167c3630-4a16-4056-855f-ba15d3f3fc74/styles.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<script src="_ds/nocturne-167c3630-4a16-4056-855f-ba15d3f3fc74/_ds_bundle.js"></script>
<style>
  :root {
    --color-accent: #d9629f;
    --color-accent-100: #fdf3f8;
    --color-accent-200: #f9e2ee;
    --color-accent-300: #f2c9de;
    --color-accent-400: #e79ac0;
    --color-accent-500: #d9629f;
    --color-accent-600: #b34f83;
    --color-accent-700: #8b3e66;
    --color-accent-800: #62304a;
    --color-accent-900: #3b2130;
    --color-accent-2: #e79ac0;
    --color-accent-2-100: #fdf3f8;
    --color-accent-2-200: #f9e2ee;
    --color-accent-2-300: #f2c9de;
    --color-accent-2-400: #e79ac0;
    --color-accent-2-500: #d9629f;
    --color-accent-2-600: #b34f83;
    --color-accent-2-700: #8b3e66;
    --color-accent-2-800: #62304a;
    --color-accent-2-900: #3b2130;
  }
</style>
</helmet>
<div style="min-width:0;border-radius:8px;overflow:hidden;background:#232532;box-shadow:0 0 0 1px #3f424d">
  <div style="position:relative;flex:none;aspect-ratio:{{ ratio }};overflow:hidden;background:#14161f">
    <div style="position:absolute;inset:-14%;background:{{ art }};filter:{{ blurCss }}"></div>
    <div style="position:absolute;inset:0;background:linear-gradient(to top, rgba(18,20,31,0.9), rgba(18,20,31,0.05) 62%)"></div>
    <sc-if value="{{ isBlurred }}" hint-placeholder-val="{{ true }}">
      <div style="position:absolute;inset:0;display:grid;place-items:center;color:rgba(233,233,237,0.5);font-size:20px"><i class="ph ph-eye-closed"></i></div>
    </sc-if>
    <div style="position:absolute;left:7px;top:7px;display:flex;gap:5px">
      <span style="font-size:10px;padding:2px 6px;border-radius:5px;background:rgba(18,20,31,0.75);color:#cfd3e5">{{ res }}</span>
    </div>
    <div style="position:absolute;right:7px;bottom:7px;font-size:10px;padding:2px 6px;border-radius:5px;background:rgba(18,20,31,0.8);color:#e9e9ed;font-variant-numeric:tabular-nums">{{ dur }}</div>
    <div style="position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(233,233,237,0.12)"><div style="height:100%;width:{{ progress }};background:#d9629f"></div></div>
  </div>
  <div style="padding:8.4px 9px 10px;display:flex;flex-direction:column;gap:5px">
    <div style="font-size:13px;line-height:1.25;color:#e9e9ed;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ title }}</div>
    <div style="display:flex;align-items:center;gap:6px;font-size:11px;color:#75798c;min-width:0">
      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0">{{ meta }}</span>
      <span style="margin-left:auto;display:flex;align-items:center;gap:3px;flex:none;color:#d9629f"><i class="ph ph-tag" style="font-size:11px"></i>{{ tagCount }}</span>
    </div>
    <div style="display:flex;align-items:center;gap:4px;min-width:0">
      <span style="display:flex;gap:1px">
        <sc-for list="{{ stars }}" as="s" hint-placeholder-count="5">
          <i class="{{ s.icon }}" style="font-size:10px;color:{{ s.color }}"></i>
        </sc-for>
      </span>
      <span style="font-size:10px;color:#9397ab;font-variant-numeric:tabular-nums">{{ score }}</span>
      <span style="margin-left:auto;flex:none;display:flex;align-items:center;gap:3px;font-size:10px;color:#5f6373"><i class="ph ph-chat-circle" style="font-size:10px"></i>{{ comments }}</span>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:240,&quot;height&quot;:200},&quot;item&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{title:string,meta:string,dur:string,res:string,tags:number,hue:number,progress:string}&quot;},&quot;blur&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const it = this.props.item || {};
    const h = it.hue == null ? 280 : it.hue;
    const blurred = this.props.blur !== false;
    const rating = it.rating == null ? 0 : it.rating;
    const stars = [1, 2, 3, 4, 5].map(n => rating >= n - 0.5
      ? { icon: 'ph-fill ph-star', color: '#d9629f' }
      : { icon: 'ph ph-star', color: '#4a4d5c' });
    return {
      ratio: this.props.ratio || '16/10',
      stars,
      score: rating ? rating.toFixed(1) : '—',
      comments: it.comments == null ? 0 : it.comments,
      title: it.title || 'Untitled clip',
      meta: it.meta || 'Unsorted',
      dur: it.dur || '18:42',
      res: it.res || '1080p',
      tagCount: it.tags == null ? 0 : it.tags,
      progress: it.progress || '0%',
      isBlurred: blurred,
      blurCss: blurred ? 'blur(17px) saturate(1.25)' : 'blur(2px) saturate(1.1)',
      art: 'radial-gradient(58% 66% at 32% 34%, hsl(' + h + ' 34% 54%), transparent 72%),' +
           'radial-gradient(52% 62% at 74% 64%, hsl(' + ((h + 42) % 360) + ' 32% 44%), transparent 74%),' +
           'linear-gradient(155deg,#2b2e46,#14161f)'
    };
  }
}

</script>
</body>
</html>
