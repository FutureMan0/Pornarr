name: PR title

# The pull-request title becomes the squashed commit on develop, which is what
# release-please reads. A non-conventional title silently drops the whole PR
# from the changelog and the version calculation.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  title:
    runs-on: self-hosted
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            docs
            test
            refactor
            style
            chore
            ci
            build
            revert
          requireScope: false
