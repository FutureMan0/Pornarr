name: Release

# Runs on main. develop already carries the version and changelog by the time it
# merges here, so this job only tags, builds and publishes.
on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      # GHCR rejects mixed-case repository names and the owner is `FutureMan0`.
      - id: image
        run: |
          echo "ref=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/pornarr" >> "$GITHUB_OUTPUT"

      - name: Read version
        id: version
        run: |
          VERSION=$(jq -r '.["."]' .release-please-manifest.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag
        if: steps.version.outputs.exists == 'false'
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - uses: docker/setup-qemu-action@v3
        if: steps.version.outputs.exists == 'false'
      - uses: docker/setup-buildx-action@v3
        if: steps.version.outputs.exists == 'false'
      - uses: docker/login-action@v3
        if: steps.version.outputs.exists == 'false'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        if: steps.version.outputs.exists == 'false'
        id: meta
        with:
          images: ${{ steps.image.outputs.ref }}
          tags: |
            type=semver,pattern={{version}},value=v${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.version.outputs.version }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        if: steps.version.outputs.exists == 'false'
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      - name: Scan image
        if: steps.version.outputs.exists == 'false'
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}:${{ steps.version.outputs.version }}
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: "false"
          exit-code: "1"

      - name: Publish GitHub release
        if: steps.version.outputs.exists == 'false'
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --notes-file <(awk '/^## /{if(n++)exit}n' CHANGELOG.md)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
