name: E2E

on:
  push:
    branches: [develop]
  # The image build alone proves nothing about whether the stack starts: #300
  # shipped an entrypoint the runtime image could not execute, and only the
  # post-merge E2E run on develop caught it. Anything that can change how a
  # container comes up now pays for a full start here, on the pull request.
  pull_request:
    # Stacked pull requests target another feature branch, and with only
    # develop and main listed here they ran no checks at all: #279 through
    # #284 arrived on develop as one red pipeline. See #309.
    branches: [develop, main, "feat/**", "fix/**", "chore/**", "docs/**", "test/**"]
    paths:
      - "Dockerfile"
      - "docker-compose*.yml"
      - "infrastructure/docker/**"
      # A change to the end-to-end tests has to run the end-to-end tests. They
      # were previously only exercised after a merge to develop, which is how
      # three assertions that never matched the real screens went unnoticed.
      - "tests/e2e/**"
      - "playwright.config.ts"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Workspace present
    runs-on: self-hosted
    outputs:
      web: ${{ steps.check.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: test -f package.json && echo "web=true" >> "$GITHUB_OUTPUT" || echo "web=false" >> "$GITHUB_OUTPUT"

  e2e:
    name: Playwright
    needs: guard
    if: needs.guard.outputs.web == 'true'
    runs-on: self-hosted
    # The suite does not only drive the browser. A claim the API does not
    # expose -- what is in Redis, what row the database holds, what parameters
    # really reached an indexer -- is read by shelling into the stack, and the
    # specs address it by compose project name. Compose derives that name from
    # the checkout directory unless told otherwise, so the stack came up as
    # `pornarr` and every one of those reads went looking for a project that
    # was not there. `composeExec` answers null on failure, by design, so the
    # tests did not report a harness that could not reach the stack: they
    # reported an empty Redis, no configured download client and an indexer
    # fan-out that reached nobody, as if the product had lost them.
    #
    # Both halves are named here rather than one derived from the other,
    # because they are read by different programs and only agreement matters.
    # A name of this job's own, so a runner that also hosts a developer's stack
    # can neither be read by these tests nor torn down by the step below.
    #
    # `docker-compose.testing.yml` carries the fixture indexer and the download
    # client the acquisition chain is driven through; it is what the specs name
    # when they say what is missing. An explicit file list disables the
    # automatic pickup of the override, so all three are listed.
    env:
      COMPOSE_PROJECT_NAME: pornarr_e2e
      E2E_COMPOSE_PROJECT: pornarr_e2e
      COMPOSE_FILE: docker-compose.yml:docker-compose.override.yml:docker-compose.testing.yml
    steps:
      - uses: actions/checkout@v4
      # Version comes from the `packageManager` field in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: make setup
      - name: Start the full stack
        run: docker compose up -d --wait
      - name: Run end-to-end suite
        run: pnpm exec playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - if: always()
        run: docker compose logs --tail=100
      # A hosted runner is discarded after the job, so nothing here ever needed
      # cleaning up. A self-hosted runner keeps everything: without this the
      # stack, its network and its volumes survive the run, and the next run
      # inherits a database that a previous one already migrated and seeded.
      - name: Tear down the stack
        if: always()
        run: docker compose down --volumes --remove-orphans
