name: E2E

on:
  push:
    branches: [develop]
  # The image build alone proves nothing about whether the stack starts: #300
  # shipped an entrypoint the runtime image could not execute, and only the
  # post-merge E2E run on develop caught it. Anything that can change how a
  # container comes up now pays for a full start here, on the pull request.
  pull_request:
    # Stacked pull requests target another feature branch, and with only
    # develop and main listed here they ran no checks at all: #279 through
    # #284 arrived on develop as one red pipeline. See #309.
    branches: [develop, main, "feat/**", "fix/**", "chore/**", "docs/**", "test/**"]
    paths:
      - "Dockerfile"
      - "docker-compose*.yml"
      - "infrastructure/docker/**"
      # A change to the end-to-end tests has to run the end-to-end tests. They
      # were previously only exercised after a merge to develop, which is how
      # three assertions that never matched the real screens went unnoticed.
      - "tests/e2e/**"
      - "playwright.config.ts"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Workspace present
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.check.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: test -f package.json && echo "web=true" >> "$GITHUB_OUTPUT" || echo "web=false" >> "$GITHUB_OUTPUT"

  e2e:
    name: Playwright
    needs: guard
    if: needs.guard.outputs.web == 'true'
    runs-on: ubuntu-latest
    # A project name of this job's own. Compose otherwise derives one from the
    # checkout directory, which on a persistent runner can be the same name a
    # developer's own stack is using -- and the teardown below removes volumes.
    # The suite reads the same variable when it shells into the stack, so both
    # halves are named here: they are read by different programs and only
    # agreement between them matters.
    #
    # No `docker-compose.testing.yml`. It carries the fixture indexer and the
    # download client the acquisition chain needs, and nothing this job runs
    # drives that chain -- see the smoke step below for why. Leaving it out
    # also leaves out two containers this job would otherwise wait on.
    env:
      COMPOSE_PROJECT_NAME: pornarr_e2e
      E2E_COMPOSE_PROJECT: pornarr_e2e
    steps:
      - uses: actions/checkout@v4
      # Version comes from the `packageManager` field in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: make setup
      - name: Start the full stack
        run: docker compose up -d --wait
      # The smoke file only. The full suite drives fourteen flows against real
      # containers and took 54 minutes here against a quarter of an hour on a
      # developer machine, and nine of its cases fail on this runner in a way
      # that reproduces nowhere else -- an extra container that never answers,
      # an FFmpeg that never starts, an import placed where a hold was due.
      # Every one of them passes locally against a stack built from scratch, so
      # what the pipeline reported was the runner, not the product, at an hour
      # a pull request. `docs/contributing/testing.md` says where the suite is
      # run instead.
      - name: Smoke the running stack
        run: pnpm exec playwright test tests/e2e/smoke.spec.ts
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - if: always()
        run: docker compose logs --tail=100
      # A hosted runner is discarded after the job, so nothing here ever needed
      # cleaning up. A self-hosted runner keeps everything: without this the
      # stack, its network and its volumes survive the run, and the next run
      # inherits a database that a previous one already migrated and seeded.
      - name: Tear down the stack
        if: always()
        run: docker compose down --volumes --remove-orphans

      # Compose rebuilds seven images from a bind-mounted checkout, so every
      # code change orphans the previous layers. Removing the stack does not
      # touch them, and on a runner that is never discarded they accumulated
      # until Docker's 20 GB store was full: the daemon could no longer write,
      # the runner container died mid-build, and `docker builder prune` itself
      # then failed for want of space.
      #
      # Untagged layers only, so nothing another container on this machine is
      # actually using can be taken. The day of cache is what keeps a run that
      # follows this one from rebuilding the world.
      - name: Reclaim what the build orphaned
        if: always()
        run: |
          docker image prune --force
          docker builder prune --force --filter until=24h
