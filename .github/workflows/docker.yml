name: Docker

on:
  pull_request:
    # Stacked pull requests target another feature branch, and with only
    # develop and main listed here they ran no checks at all: #279 through
    # #284 arrived on develop as one red pipeline. See #309.
    branches: [develop, main, "feat/**", "fix/**", "chore/**", "docs/**", "test/**"]
    paths:
      - "Dockerfile"
      - "apps/**"
      - "packages/**"
      - "uv.lock"
      - "pnpm-lock.yaml"
      - ".github/workflows/docker.yml"
  push:
    branches: [develop]

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build image
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The Dockerfile does not exist until #14 lands.
      - id: guard
        run: test -f Dockerfile && echo "build=true" >> "$GITHUB_OUTPUT" || echo "build=false" >> "$GITHUB_OUTPUT"

      # GHCR rejects mixed-case repository names and the owner is `FutureMan0`,
      # so the reference has to be lowercased rather than interpolated directly.
      - id: image
        if: steps.guard.outputs.build == 'true'
        run: |
          echo "ref=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/pornarr" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
        if: steps.guard.outputs.build == 'true'

      # Pull requests build a single architecture and never push.
      # Multi-architecture builds happen at release. See ADR-0011 and ADR-0023.
      - name: Log in to GHCR
        if: steps.guard.outputs.build == 'true' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        if: steps.guard.outputs.build == 'true'
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.image.outputs.ref }}:develop
            ${{ steps.image.outputs.ref }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # `setup-buildx-action` leaves its builder container behind on a runner
      # that outlives the job, and that builder holds its own cache - separate
      # from the daemon's, so `docker builder prune` never reaches it. See the
      # same step in e2e.yml for what a full Docker store did to this runner.
      - name: Reclaim the builder's cache
        if: always() && steps.guard.outputs.build == 'true'
        run: |
          docker buildx prune --force --filter until=24h
          docker image prune --force
