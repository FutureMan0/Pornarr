# qBittorrent for the `testing` compose profile only.
#
# The Web UI is unauthenticated on the compose network: the whitelist below
# bypasses the login that a fresh qBittorrent otherwise gates behind a password
# it prints once into its own log. That is acceptable for a throwaway container
# on an isolated network and nowhere else.
#
# Incomplete downloads live on a volume Pornarr cannot see, so a file only
# appears in `/data/torrents` when the client has finished with it and moved it
# there - which is what makes the import trigger provably the client's doing.
[Application]
FileLogger\Enabled=true

[BitTorrent]
Session\DefaultSavePath=/data/torrents/completed
Session\TempPath=/data/qbt-incomplete
Session\TempPathEnabled=true
Session\DHT=false
Session\PeX=false
Session\LSD=false
Session\Port=6881

[Preferences]
WebUI\Address=*
WebUI\Port=8080
WebUI\LocalHostAuth=false
WebUI\AuthSubnetWhitelistEnabled=true
WebUI\AuthSubnetWhitelist=0.0.0.0/0
WebUI\CSRFProtection=false
WebUI\HostHeaderValidation=false
