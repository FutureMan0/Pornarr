# SABnzbd seed for the `live` compose profile only.
# Placeholders are substituted from the environment at container start;
# the account itself lives in `.env.live`, which is not in the repository.
# The API key is fixed so the suite can talk to the client without a human
# clicking through its wizard. Acceptable for a throwaway container on an
# isolated network and nowhere else.
__version__ = 19
[misc]
host = 0.0.0.0
port = 8080
api_key = ${SAB_API_KEY}
nzb_key = ${SAB_NZB_KEY}
disable_api_key = 0
host_whitelist = sabnzbd, localhost, 127.0.0.1
inet_exposure = 4
permissions = 0775
download_dir = /data/sab-incomplete
complete_dir = /data/usenet/completed
dirscan_dir = /data/usenet/watch
script_dir = ""
enable_unrar = 1
enable_par_cleanup = 1
pause_on_post_processing = 0
auto_disconnect = 1
check_new_rel = 0
auto_browser = 0
language = en
[categories]
[[*]]
name = *
order = 0
dir = ""
priority = 0
[[pornarr]]
name = pornarr
order = 1
dir = ""
priority = 0
[servers]
[[provider]]
name = ${USENET_HOST}
displayname = ${USENET_HOST}
host = ${USENET_HOST}
port = ${USENET_PORT}
timeout = 60
username = ${USENET_USERNAME}
password = ${USENET_PASSWORD}
connections = 8
ssl = 1
ssl_verify = 2
enable = 1
optional = 0
retention = 0
priority = 0
