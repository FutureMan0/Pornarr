# Development overrides. Applied automatically by `docker compose up`.
# Source is bind-mounted and every process reloads on change.
# See docs/adr/0014-containerized-development.md

services:
  api:
    build:
      context: .
      target: development
    command: api --reload
    environment:
      APP_ENV: development
      LOG_LEVEL: debug
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages
    ports:
      - "8000:8000"
      - "5678:5678"   # debugpy

  worker:
    build:
      context: .
      target: development
    command: worker --watch /app
    environment:
      APP_ENV: development
      LOG_LEVEL: debug
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages
    ports:
      - "5679:5678"   # debugpy

  worker-import:
    build:
      context: .
      target: development
    command: worker import --watch /app
    environment:
      APP_ENV: development
      LOG_LEVEL: debug
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages

  worker-transcode:
    build:
      context: .
      target: development
    command: worker transcode --watch /app
    environment:
      APP_ENV: development
      LOG_LEVEL: debug
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages

  worker-indexer:
    build:
      context: .
      target: development
    command: worker indexer --watch /app
    environment:
      APP_ENV: development
      LOG_LEVEL: debug
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages

  beat:
    build:
      context: .
      target: development
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages

  # The Vite dev server does not use the application image: it needs Node, and
  # the production image deliberately has none — the built assets are served by
  # FastAPI. See docs/adr/0008-vite-spa.md
  web:
    image: node:22-slim
    working_dir: /app
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      VITE_API_URL: http://api:8000
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @pornarr/web run dev --host"
    volumes:
      - .:/app
      - /app/node_modules
    ports: ["5173:5173"]
