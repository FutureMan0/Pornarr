# Development overrides. Applied automatically by `docker compose up`.
# Source is bind-mounted and every process reloads on change.
# See docs/adr/0014-containerized-development.md

# Its own tag, deliberately. The base file names every service
# `ghcr.io/futureman0/pornarr:${PORNARR_TAG:-latest}`; without a separate name
# here the development build and the runtime build write the same tag and the
# last one to finish owns it. `migrate` has no override and must run the
# production artifact — on the development image, which carries no source, it
# fails with "No 'script_location' key found in configuration" and takes the
# whole stack down with it. See #303.
x-development-image: &development-image
  image: pornarr-dev:latest
  build:
    context: .
    target: development

services:
  api:
    <<: *development-image
    command: api --reload
    environment:
      APP_ENV: development
      LOG_LEVEL: debug
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages
    ports:
      - "8000:8000"
      - "5678:5678"   # debugpy

  worker:
    <<: *development-image
    command: worker --watch /app
    environment:
      APP_ENV: development
      LOG_LEVEL: debug
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages
    ports:
      - "5679:5678"   # debugpy

  worker-import:
    <<: *development-image
    command: worker import --watch /app
    environment:
      APP_ENV: development
      LOG_LEVEL: debug
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages

  worker-transcode:
    <<: *development-image
    command: worker transcode --watch /app
    environment:
      APP_ENV: development
      LOG_LEVEL: debug
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages

  worker-indexer:
    <<: *development-image
    command: worker indexer --watch /app
    environment:
      APP_ENV: development
      LOG_LEVEL: debug
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages

  beat:
    <<: *development-image
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages

  # The Vite dev server does not use the application image: it needs Node, and
  # the production image deliberately has none — the built assets are served by
  # FastAPI. See docs/adr/0008-vite-spa.md
  web:
    image: node:22-slim
    working_dir: /app
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      VITE_API_URL: http://api:8000
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @pornarr/web run dev --host"
    volumes:
      - .:/app
      - /app/node_modules
    ports: ["5173:5173"]
