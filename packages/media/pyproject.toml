[project]
name = "pornarr-media"
version = "0.0.0"
description = "ffprobe, ffmpeg, hashing, transcode sessions"
requires-python = "==3.13.*"
dependencies = ["pornarr-shared"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pornarr_media"]
