[project]
name = "pornarr-db"
version = "0.0.0"
description = "SQLAlchemy models, migrations, repositories"
requires-python = "==3.13.*"
dependencies = ["pornarr-shared"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pornarr_db"]
