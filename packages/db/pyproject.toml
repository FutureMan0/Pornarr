[project]
name = "pornarr-db"
version = "0.0.0"
description = "SQLAlchemy models, migrations, repositories"
requires-python = "==3.13.*"
dependencies = [
    "pornarr-shared",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary,pool]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pornarr_db"]
