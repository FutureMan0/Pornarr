[project]
name = "pornarr-shared"
version = "0.0.0"
description = "Configuration, logging, errors, encryption, event bus"
requires-python = "==3.13.*"
dependencies = [
    "arq>=0.28,<0.29",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "cryptography>=44.0",
    "prometheus-client>=0.21,<0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pornarr_shared"]
