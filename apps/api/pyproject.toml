[project]
name = "pornarr-api"
version = "0.0.0"
description = "FastAPI application: HTTP, auth, events, static serving"
requires-python = "==3.13.*"
dependencies = [
    "pornarr-core",
    "pornarr-db",
    "pornarr-integrations",
    "pornarr-media",
    "pornarr-shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "redis>=5.2",
    "argon2-cffi>=23.1",
    "httpcore>=1.0",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pornarr_api"]
