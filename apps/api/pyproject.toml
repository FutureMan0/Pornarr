[project]
name = "pornarr-api"
version = "0.0.0"
description = "FastAPI application: HTTP, auth, events, static serving"
requires-python = "==3.13.*"
dependencies = ["pornarr-core", "pornarr-db", "pornarr-integrations", "pornarr-media", "pornarr-shared"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pornarr_api"]
