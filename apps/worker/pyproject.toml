[project]
name = "pornarr-worker"
version = "0.0.0"
description = "arq worker: background jobs and cron"
requires-python = "==3.13.*"
dependencies = ["pornarr-core", "pornarr-db", "pornarr-integrations", "pornarr-media", "pornarr-shared"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pornarr_worker"]
